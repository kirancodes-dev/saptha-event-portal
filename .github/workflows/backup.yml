# Daily database backup to a private bucket (UPG-21). See docs/DEPLOY.md, "Backups".
# Does nothing until the repository secrets BACKUP_DATABASE_URL and
# BACKUP_BUCKET are set. Use this OR a Cloud Run job, not both.
name: Database backup

on:
  schedule:
    - cron: '30 20 * * *'   # daily, 02:00 IST
  workflow_dispatch:

permissions: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Back up
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '30' }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_AWS_REGION || 'ap-south-1' }}
          PG_MAJOR: ${{ vars.BACKUP_PG_MAJOR || '17' }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_BUCKET" ]; then
            echo "::notice::BACKUP_DATABASE_URL or BACKUP_BUCKET is not set; nothing to back up."
            exit 0
          fi
          # pg_dump must be the server's major version or newer
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq "postgresql-client-$PG_MAJOR" > /dev/null
          export PATH="/usr/lib/postgresql/$PG_MAJOR/bin:$PATH"
          scripts/backup_db.sh
