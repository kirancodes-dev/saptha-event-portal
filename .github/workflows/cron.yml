# Scheduled jobs for a deploy without Celery beat (UPG-07).
# Calls POST <CRON_URL>/internal/cron/<job> with the shared secret.
# Use this OR Cloud Scheduler (docs/DEPLOY.md), not both. It does nothing
# until the repository secrets CRON_URL (the app's BASE_URL, e.g.
# https://events.example.edu) and CRON_SECRET (same value as the app's
# CRON_SECRET) are set. GitHub may start scheduled runs a few minutes late.
name: Scheduled jobs

on:
  schedule:
    - cron: '0 * * * *'      # reminders: every hour
    - cron: '15 */6 * * *'   # lifecycle: every 6 hours
    - cron: '45 21 * * *'    # cleanup: daily, 03:15 IST
  workflow_dispatch:
    inputs:
      job:
        description: Job to run now
        type: choice
        options: [reminders, lifecycle, cleanup]

permissions: {}

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Call the cron endpoint
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.job }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_URL or CRON_SECRET is not set; nothing to call."
            exit 0
          fi
          case "$SCHEDULE" in
            '0 * * * *')    job=reminders ;;
            '15 */6 * * *') job=lifecycle ;;
            '45 21 * * *')  job=cleanup ;;
            *)              job="$CHOSEN" ;;
          esac
          curl --fail-with-body --silent --show-error --max-time 1800 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            "${CRON_URL%/}/internal/cron/$job"
