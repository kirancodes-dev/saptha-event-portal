version: '3.8'

# ================================================================
# SapthaEvent — Industrial Production Stack
# ================================================================
# Services:
#   nginx          — load balancer / reverse proxy (port 80/443)
#   web            — Flask/Gunicorn stateless web fleet (scale 3-5)
#   celery-worker  — async task workers (email, certs, exports, webhooks)
#   celery-beat    — scheduled job dispatcher (single instance)
#   flower         — Celery monitoring dashboard (port 5555)
#   redis          — session store + rate-limit backend + Celery broker
#
# Usage:
#   dev:   docker compose up
#   prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   scale: docker compose up --scale web=5 --scale celery-worker=3
# ================================================================

x-app-env: &app-env
  FLASK_ENV: ${FLASK_ENV:-development}
  SECRET_KEY: ${SECRET_KEY}
  FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
  MAIL_USER: ${MAIL_USER:-}
  MAIL_PASS: ${MAIL_PASS:-}
  MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_SENDER: ${MAIL_SENDER:-}
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
  SUPER_ADMIN_PASS: ${SUPER_ADMIN_PASS:-}
  MASTER_SECRET_KEY: ${MASTER_SECRET_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
  BASE_URL: ${BASE_URL:-http://localhost}
  SENTRY_DSN: ${SENTRY_DSN:-}
  GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
  # Redis — shared by sessions, rate-limiter, Celery broker
  REDIS_URL: redis://redis:6379/0
  SESSION_TYPE: redis
  RATELIMIT_STORAGE_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  # Web fleet: NO background scheduler
  NO_SCHEDULER: "true"

services:

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Web Fleet (stateless Gunicorn workers) ──────────────
  web:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "8080"
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ── Async Celery Workers ─────────────────────────────────
  celery-worker:
    build: .
    restart: unless-stopped
    command: >
      celery -A celery_app.celery worker
      --loglevel=info
      --concurrency=4
      --queues=default,email,certs,exports,webhooks
      --hostname=worker@%h
      --max-tasks-per-child=500
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 5
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_app.celery", "inspect", "ping", "-d", "worker@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery Beat — scheduled job dispatcher ───────────────
  # MUST be a single instance — never scale > 1
  celery-beat:
    build: .
    restart: unless-stopped
    command: >
      celery -A celery_app.celery beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
      --schedule /tmp/celerybeat-schedule
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1          # never scale — duplicate beats = duplicate jobs
      restart_policy:
        condition: on-failure
        max_attempts: 5
      resources:
        limits:
          memory: 256M

  # ── Flower — Celery monitoring dashboard ─────────────────
  flower:
    build: .
    restart: unless-stopped
    command: >
      celery -A celery_app.celery flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme}
      --url_prefix=flower
    environment:
      <<: *app-env
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Nginx — load balancer / reverse proxy ────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
    driver: local
  nginx_logs:
    driver: local
