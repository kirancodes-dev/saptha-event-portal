<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ═══ SEO Meta Tags ═══ -->
<meta name="description" content="A server error occurred on SapthaEvent. Our team has been notified. Please try again later.">
<meta name="robots" content="noindex, nofollow">
<!-- ═══ Canonical ═══ -->
<link rel="canonical" href="https://events.snpsu.edu.in">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<title>500 - Server Error | SapthaEvent</title>
<link href="/static/css/global.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg-app);color:var(--ink-800);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:background var(--t);}
.card{background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--ink-200);padding:48px 36px;max-width:480px;width:100%;text-align:center;box-shadow:var(--shadow-md);transition:all var(--t);}
.code{font-family:'Plus Jakarta Sans',sans-serif;font-size:72px;font-weight:800;color:var(--danger);line-height:1;margin-bottom:12px;}
.title{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;color:var(--ink-900);margin-bottom:12px;}
.desc{font-size:14.5px;color:var(--ink-500);line-height:1.65;margin-bottom:32px;}
.divider{border:none;border-top:1px solid var(--ink-200);margin:24px 0;}
.btn-home{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg, var(--snpsu-gold), var(--snpsu-gold-dark));color:#fff !important;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;padding:12px 28px;border-radius:var(--radius-sm);text-decoration:none;transition:var(--t-fast);margin:4px;}
.btn-home:hover{transform:translateY(-1px);box-shadow:var(--shadow-gold);color:#fff !important;}
.btn-back{display:inline-flex;align-items:center;gap:8px;background:var(--bg-soft);color:var(--ink-700);font-size:14px;font-weight:600;padding:12px 24px;border-radius:var(--radius-sm);text-decoration:none;transition:var(--t-fast);margin:4px;border:1px solid var(--ink-300);}
.btn-back:hover{background:var(--bg-muted);color:var(--ink-900);border-color:var(--ink-400);}
.uni{font-size:12px;color:var(--ink-400);margin-top:16px;font-weight:500;}
.ref{font-size:11px;color:var(--ink-400);margin-top:8px;font-family:monospace;}
/* ── ACCESSIBILITY ────────────────────── */
*:focus-visible{outline:3px solid var(--snpsu-gold);outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>
<body role="main" aria-label="500 Server Error">
<div class="card" role="region" aria-live="polite" aria-label="Server error message">
  <img src="/static/snpsu-logo.png" alt="Sapthagiri NPS University" style="height:52px;width:auto;object-fit:contain;margin-bottom:12px;" aria-hidden="true">
  <div class="code" aria-label="Error code">500</div>
  <h1 class="title">Something Went Wrong</h1>
  <p class="desc">
    An unexpected error occurred on our end.<br>
    Please try again in a moment. If the problem persists,
    contact your event coordinator.
  </p>
  <div>
    <a href="/" class="btn-home">↩ Return Home</a>
    <a href="javascript:history.back()" class="btn-back">← Go Back</a>
  </div>
  <div class="divider"></div>
  <div style="text-align:center;margin-bottom:8px;">
    <img src="/static/snpsu-logo.png"
         alt="Sapthagiri NPS University"
         style="height:24px;width:auto;object-fit:contain;"
         onerror="this.style.display='none'">
  </div>
  <p class="uni">Sapthagiri NPS University, Bengaluru</p>
  <p class="ref">Error reference: {{ request.url if request else '' }}</p>
</div>
<script src="/static/js/global.js"></script>
</body>
</html>
