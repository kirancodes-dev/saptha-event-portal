<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Leaderboard | {{ event.title }}</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── PROJECTOR-OPTIMISED DARK THEME ────────────────────────────── */
:root{
  --bg:#05050f;--card:#0c0c20;--border:rgba(255,255,255,.06);
  --gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;
  --accent:#c9a45e;--blue:#1a2557;
  --green:#22c55e;--red:#ef4444;
  --text:#f1f5f9;--sub:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);
  font-family:'Inter',sans-serif;
  color:var(--text);
  display:flex;flex-direction:column;
}

/* ── HEADER ─────────────────────────────────────────────────── */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 32px;
  background:linear-gradient(90deg,#0c0c20 0%,#0d0d28 100%);
  border-bottom:1px solid rgba(201,164,94,.2);
  flex-shrink:0;
}
.hdr-left{display:flex;align-items:center;gap:14px;}
.hdr-logo{height:40px;width:auto;object-fit:contain;opacity:.9;}
.hdr-brand{font-family:'Poppins',sans-serif;font-weight:800;font-size:15px;color:var(--accent);}
.hdr-event{font-size:22px;font-weight:800;font-family:'Poppins',sans-serif;color:#fff;
           letter-spacing:-.3px;text-align:center;line-height:1.1;}
.hdr-event small{font-size:12px;font-weight:500;color:var(--sub);display:block;
                  text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.hdr-right{display:flex;align-items:center;gap:16px;}

/* LIVE badge */
.live-badge{
  display:flex;align-items:center;gap:6px;
  background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.35);
  color:#f87171;font-size:12px;font-weight:800;
  padding:5px 13px;border-radius:100px;
  text-transform:uppercase;letter-spacing:.8px;
}
.live-dot{width:7px;height:7px;border-radius:50%;background:#ef4444;
          animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.round-pill{
  background:rgba(201,164,94,.15);border:1px solid rgba(201,164,94,.35);
  color:var(--accent);font-size:13px;font-weight:700;
  padding:5px 16px;border-radius:100px;font-family:'Poppins',sans-serif;
}
.fullscreen-btn{
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  color:var(--sub);font-size:14px;padding:6px 10px;border-radius:8px;
  cursor:pointer;transition:.15s;
}
.fullscreen-btn:hover{background:rgba(255,255,255,.12);color:#fff;}

/* ── PODIUM (Top 3) ─────────────────────────────────────────── */
.podium-row{
  display:flex;align-items:flex-end;justify-content:center;
  gap:16px;padding:20px 32px 12px;flex-shrink:0;
}
.podium-card{
  background:var(--card);border-radius:18px;
  padding:20px 24px 18px;text-align:center;
  border:1px solid var(--border);position:relative;
  transition:transform .3s ease;
  flex:1;max-width:300px;
}
.podium-card.rank-1{
  border-color:rgba(255,215,0,.3);
  background:linear-gradient(135deg,#120d02 0%,#1a1005 100%);
  transform:scale(1.04);order:2;
}
.podium-card.rank-2{
  border-color:rgba(192,192,192,.25);
  background:linear-gradient(135deg,#0e0e0e 0%,#131313 100%);
  order:1;
}
.podium-card.rank-3{
  border-color:rgba(205,127,50,.25);
  background:linear-gradient(135deg,#0e0905 0%,#14100a 100%);
  order:3;
}
.podium-medal{font-size:40px;margin-bottom:6px;line-height:1;}
.podium-rank{
  font-family:'Poppins',sans-serif;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;
}
.rank-1 .podium-rank{color:var(--gold);}
.rank-2 .podium-rank{color:var(--silver);}
.rank-3 .podium-rank{color:var(--bronze);}
.podium-team{font-family:'Poppins',sans-serif;font-size:17px;font-weight:800;
             color:#fff;line-height:1.2;margin-bottom:4px;}
.podium-lead{font-size:12px;color:var(--sub);margin-bottom:12px;}
.podium-score{
  font-family:'Poppins',sans-serif;font-size:28px;font-weight:900;line-height:1;
}
.rank-1 .podium-score{color:var(--gold);}
.rank-2 .podium-score{color:var(--silver);}
.rank-3 .podium-score{color:var(--bronze);}
.podium-score span{font-size:14px;font-weight:600;opacity:.7;margin-left:2px;}
.judge-count{font-size:11px;color:var(--sub);margin-top:4px;}

/* ── REST OF LEADERBOARD ─────────────────────────────────────── */
.board-wrap{
  flex:1;overflow-y:auto;padding:0 32px 20px;
}
.board-table{width:100%;border-collapse:collapse;}
.board-table th{
  font-size:10px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--sub);font-weight:600;padding:6px 12px;
  border-bottom:1px solid var(--border);
}
.board-row{
  border-bottom:1px solid var(--border);
  transition:background .2s;
}
.board-row:hover{background:rgba(255,255,255,.03);}
.board-row td{padding:10px 12px;vertical-align:middle;}
.td-rank{width:48px;text-align:center;}
.rank-num{
  font-family:'Poppins',sans-serif;font-size:16px;font-weight:800;
  color:rgba(255,255,255,.4);
}
.td-team{font-weight:700;font-size:14.5px;color:#e2e8f0;}
.td-lead{font-size:12px;color:var(--sub);}
.td-score{width:130px;text-align:right;}
.score-val{
  font-family:'Poppins',sans-serif;font-size:17px;font-weight:800;
  color:var(--accent);
}
.score-pending{font-size:12px;color:rgba(255,255,255,.25);font-style:italic;}
.score-bar-wrap{width:120px;}
.score-bar{
  height:4px;border-radius:100px;
  background:rgba(255,255,255,.07);
  overflow:hidden;margin-top:4px;
}
.score-bar-fill{
  height:100%;border-radius:100px;
  background:linear-gradient(90deg,#c9a45e,#f8d77a);
  transition:width .6s ease;
}
.td-judges{width:64px;text-align:center;font-size:12px;color:var(--sub);}

/* RANK CHANGE ANIMATION */
.rank-up   .rank-num{color:var(--green) !important;animation:rankUp .5s ease;}
.rank-down .rank-num{color:var(--red)   !important;animation:rankDown .5s ease;}
@keyframes rankUp  {0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}
@keyframes rankDown{0%{transform:translateY(-8px);opacity:0}100%{transform:none;opacity:1}}

/* ── FOOTER ─────────────────────────────────────────────────── */
.ftr{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 32px;
  border-top:1px solid var(--border);
  font-size:12px;color:var(--sub);flex-shrink:0;
}
.ftr-timer{display:flex;align-items:center;gap:6px;}
.conn-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0;}
.conn-dot.disconnected{background:#ef4444;}

/* ── WAITING / EMPTY STATE ──────────────────────────────────── */
.empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;color:var(--sub);
}
.empty-state i{font-size:56px;opacity:.3;}

/* ── SCROLL STYLING ─────────────────────────────────────────── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-left">
    <img src="/static/snpsu-logo.png" alt="SNPSU" class="hdr-logo"
         onerror="this.style.display='none'">
    <span class="hdr-brand">SapthaEvent</span>
  </div>

  <div style="text-align:center;">
    <div class="hdr-event">
      {{ event.title }}
      <small>Sapthagiri NPS University &nbsp;·&nbsp; {{ event.venue or 'SNPSU Campus' }}</small>
    </div>
  </div>

  <div class="hdr-right">
    <span class="round-pill" id="roundPill">Round 1</span>
    <span class="live-badge"><span class="live-dot"></span>LIVE</span>
    <button class="fullscreen-btn" onclick="toggleFS()" title="Fullscreen">
      <i class="fas fa-expand"></i>
    </button>
  </div>
</div>

<!-- PODIUM — top 3 -->
<div class="podium-row" id="podiumRow">
  <!-- filled by JS -->
  <div class="empty-state" style="flex:1;padding:40px 0;">
    <i class="fas fa-trophy"></i>
    <p>Waiting for scores…</p>
  </div>
</div>

<!-- REST OF BOARD (rank 4+) -->
<div class="board-wrap" id="boardWrap" style="display:none;">
  <table class="board-table">
    <thead>
      <tr>
        <th class="td-rank">Rank</th>
        <th>Team / Participant</th>
        <th style="text-align:right;">Score</th>
        <th class="td-judges" style="text-align:center;"><i class="fas fa-gavel"></i></th>
      </tr>
    </thead>
    <tbody id="boardBody"></tbody>
  </table>
</div>

<!-- EMPTY if no data -->
<div class="empty-state" id="emptyState" style="display:none;">
  <i class="fas fa-hourglass-half"></i>
  <p>Scoring in progress. Leaderboard will appear here.</p>
</div>

<!-- FOOTER -->
<div class="ftr">
  <div class="ftr-timer">
    <span class="conn-dot" id="connDot"></span>
    <span id="connLabel">Connecting…</span>
  </div>
  <span>Last updated <span id="lastTs">—</span></span>
  <span>
    <i class="fas fa-users me-1"></i>
    <span id="totalCount">—</span> participants
  </span>
</div>

<script>
const EVENT_ID = {{ event_id | tojson }};

// ── Rank memory for change detection ──────────────────────────────────
let prevRanks = {};   // reg_id → rank

// ── SSE ───────────────────────────────────────────────────────────────
let es;

function connect() {
  es = new EventSource(`/live/stream/${EVENT_ID}`);
  es.onmessage  = e => render(JSON.parse(e.data));
  es.onerror    = ()  => setConn(false);
  es.onopen     = ()  => setConn(true);
  es.addEventListener('reconnect', () => { es.close(); setTimeout(connect, 500); });
}

function setConn(ok) {
  document.getElementById('connDot').className  = 'conn-dot' + (ok ? '' : ' disconnected');
  document.getElementById('connLabel').textContent = ok ? 'Live' : 'Reconnecting…';
}

// ── Initial load via JSON (before first SSE message) ─────────────────
fetch(`/live/data/${EVENT_ID}`)
  .then(r => r.json())
  .then(d => { if (!d.error) render(d); })
  .catch(() => {});

connect();

// ── Render ────────────────────────────────────────────────────────────
function render(data) {
  if (data.error) return;

  document.getElementById('roundPill').textContent  = data.round_label || `Round ${data.cur_round}`;
  document.getElementById('totalCount').textContent = data.total || 0;
  document.getElementById('lastTs').textContent     = new Date().toLocaleTimeString('en-IN',
    { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  const board = data.board || [];
  const scored = board.filter(r => r.score !== null);

  if (!scored.length) {
    document.getElementById('podiumRow').innerHTML = `
      <div class="empty-state" style="flex:1;padding:40px 0;">
        <i class="fas fa-trophy"></i><p>Waiting for scores…</p>
      </div>`;
    document.getElementById('boardWrap').style.display  = 'none';
    document.getElementById('emptyState').style.display = 'none';
    return;
  }

  const maxScore = Math.max(...scored.map(r => r.score));

  // ── Podium ──────────────────────────────────────────────────────────
  const medals  = ['🥇','🥈','🥉'];
  const classes = ['rank-1','rank-2','rank-3'];
  const labels  = ['1st Place','2nd Place','3rd Place'];
  const top3    = scored.slice(0, 3);
  const podHtml = top3.map((r, i) => `
    <div class="podium-card ${classes[i]}">
      <div class="podium-medal">${medals[i]}</div>
      <div class="podium-rank">${labels[i]}</div>
      <div class="podium-team">${esc(r.team)}</div>
      <div class="podium-lead">${esc(r.lead)}</div>
      <div class="podium-score">${r.score.toFixed(1)}<span>/100</span></div>
      <div class="judge-count">${r.judges} judge${r.judges !== 1 ? 's' : ''}</div>
    </div>`).join('');
  document.getElementById('podiumRow').innerHTML = podHtml;

  // ── Rest of board (rank 4+) ──────────────────────────────────────────
  const rest = scored.slice(3);
  if (rest.length) {
    document.getElementById('boardWrap').style.display = '';
    const rows = rest.map(r => {
      const prev   = prevRanks[r.reg_id];
      const cls    = prev === undefined ? '' : (r.rank < prev ? 'rank-up' : r.rank > prev ? 'rank-down' : '');
      const barPct = maxScore > 0 ? Math.round((r.score / maxScore) * 100) : 0;
      return `<tr class="board-row ${cls}" data-id="${r.reg_id}">
        <td class="td-rank"><span class="rank-num">${r.rank}</span></td>
        <td>
          <div class="td-team">${esc(r.team)}</div>
          <div class="td-lead">${esc(r.lead)}</div>
        </td>
        <td class="td-score">
          <div class="score-val">${r.score.toFixed(1)}</div>
          <div class="score-bar-wrap">
            <div class="score-bar">
              <div class="score-bar-fill" style="width:${barPct}%"></div>
            </div>
          </div>
        </td>
        <td class="td-judges">${r.judges}</td>
      </tr>`;
    }).join('');
    document.getElementById('boardBody').innerHTML = rows;
  } else {
    document.getElementById('boardWrap').style.display = 'none';
  }

  // ── Save ranks for next diff ─────────────────────────────────────────
  const newRanks = {};
  scored.forEach(r => { newRanks[r.reg_id] = r.rank; });
  prevRanks = newRanks;

  document.getElementById('emptyState').style.display = 'none';
  setConn(true);
}

// ── Utilities ─────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function toggleFS() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
</script>
</body>
</html>
