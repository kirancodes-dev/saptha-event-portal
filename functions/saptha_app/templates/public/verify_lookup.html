<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Verify the authenticity of a SapthaEvent certificate issued by Sapthagiri NPS University.">
<title>Verify Certificate | SapthaEvent</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/css/global.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
{% include 'includes/pwa_head.html' %}
<style>
:root { --blue:#1a2557; --gold:#c9a45e; }
body {
    font-family:'Inter',sans-serif;
    background: linear-gradient(135deg, var(--blue) 0%, #1a4fa0 100%);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
}
.verify-card {
    background:#fff;
    border-radius:18px;
    max-width:460px;
    width:100%;
    box-shadow: 0 22px 54px rgba(0,0,0,.3);
    overflow:hidden;
}
.verify-head {
    background: linear-gradient(135deg, var(--blue), #1a4fa0);
    color:#fff;
    padding:28px 28px 22px;
    text-align:center;
}
.shield {
    width:68px; height:68px;
    margin: 0 auto 14px;
    border-radius:50%;
    background: rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center;
    font-size:28px;
}
.verify-head h1 {
    font-family:'Poppins', sans-serif;
    font-size:1.3rem;
    font-weight:700;
    margin:0 0 4px;
}
.verify-head p { opacity:.8; font-size:13px; margin:0; }
.verify-body { padding:26px 28px 30px; }
.form-label {
    font-size:0.75rem; font-weight:700; color:var(--blue);
    text-transform:uppercase; letter-spacing:0.5px;
}
.form-control {
    background:#f1f5f9; border:1px solid #cbd5e1;
    border-radius:8px; padding:12px 15px;
    font-family:'Courier New', monospace;
}
.form-control:focus {
    background:#fff; border-color:var(--blue);
    box-shadow: 0 0 0 4px rgba(26,37,87,.1);
}
.btn-verify {
    background: var(--gold); color:#fff;
    border:none; padding:12px; width:100%;
    border-radius:8px; font-weight:700;
    transition:.2s;
}
.btn-verify:hover { background:#b88d4d; color:#fff; transform: translateY(-1px); }
.hint {
    background:#f0f9ff;
    border:1px solid #bae6fd;
    border-radius:10px;
    padding:12px 14px;
    font-size:12px;
    color:#075985;
    margin-top:18px;
    line-height:1.6;
}
.hint i { color:#0284c7; }
</style>
</head>
<body>
<div class="verify-card">
    <div class="verify-head">
        <div class="shield"><i class="fas fa-shield-halved"></i></div>
        <h1>Verify Certificate</h1>
        <p>Confirm that a SapthaEvent certificate is authentic</p>
    </div>
    <div class="verify-body">
        <form method="POST" action="/verify">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="form-label mb-1">Certificate / Ticket ID</label>
            <input type="text" name="cert_id" class="form-control text-center"
                   placeholder="e.g. REG-ABC123"
                   autocomplete="off" required autofocus>
            <button type="submit" class="btn btn-verify mt-3">
                <i class="fas fa-check-circle me-1"></i> Verify Now
            </button>
        </form>
        <div class="hint">
            <i class="fas fa-info-circle me-1"></i>
            You can also scan the QR code on a certificate — it resolves to
            <code>/verify/&lt;id&gt;</code> on this portal.
        </div>
        <div class="text-center mt-3">
            <a href="/" class="small text-muted" style="text-decoration:none;">
                <i class="fas fa-arrow-left me-1"></i> Back to home
            </a>
        </div>
    </div>
</div>
</body>
</html>
