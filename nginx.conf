# nginx.conf — SapthaEvent load balancer / reverse proxy
# ========================================================
# Upstreams the 3-5 gunicorn web containers (Docker Compose service: web).
# Handles TLS termination (configure certs via docker-compose.prod.yml).
# Serves /static/ directly from disk — never hits Flask.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance ───────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # ── Security ──────────────────────────────────────────
    server_tokens        off;
    client_max_body_size 20M;

    # ── Upstream: web fleet ───────────────────────────────
    # Docker Compose scales 'web' to 3-5 replicas; all listen on :8080.
    # 'web' resolves to all container IPs via Docker DNS.
    upstream flask_app {
        least_conn;                        # route to least-busy worker
        server web:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Rate limiting zones ───────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=login:10m   rate=5r/m;
    limit_req_zone  $binary_remote_addr  zone=api:10m     rate=100r/m;
    limit_req_zone  $binary_remote_addr  zone=general:10m rate=300r/m;
    limit_conn_zone $binary_remote_addr  zone=addr:10m;

    # ── HTTP → HTTPS redirect ─────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ─────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # TLS — mount real certs via docker-compose.prod.yml volumes
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_prefer_server_ciphers on;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    nosniff                                always;
        add_header X-Frame-Options           SAMEORIGIN                             always;
        add_header Referrer-Policy           strict-origin-when-cross-origin        always;

        # ── Static files — served directly, never hits Flask ──
        location /static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            access_log off;
        }

        # ── Service worker — no cache ─────────────────────
        location = /sw.js {
            alias /app/static/sw.js;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        # ── Health check — bypass rate limit, no upstream log ──
        location = /health {
            proxy_pass http://flask_app;
            proxy_read_timeout 5s;
            access_log off;
        }

        # ── Login — strict rate limit ─────────────────────
        location = /login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://flask_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API routes — moderate rate limit ──────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://flask_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Flower monitoring — restrict to internal / VPN ──
        location /flower/ {
            # Uncomment to restrict by IP:
            # allow 10.0.0.0/8;
            # deny all;
            proxy_pass http://flower:5555/flower/;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        # ── All other requests ────────────────────────────
        location / {
            limit_req  zone=general burst=50 nodelay;
            limit_conn addr 20;

            proxy_pass http://flask_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;

            # Enable keepalive to upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
