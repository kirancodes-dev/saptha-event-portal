<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SapthaEvent Workflow Report Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:Inter,Arial,Helvetica,sans-serif;margin:0;background:#e6eef8;color:#10203a}
    .toolbar{display:flex;gap:8px;padding:12px;background:#fff;border-bottom:1px solid #dde6f2;align-items:center}
    .btn{background:#1a2557;color:#fff;padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
    .container{max-width:820px;margin:20px auto;background:#fff;padding:28px;border-radius:6px;box-shadow:0 8px 30px rgba(16,32,58,.06)}
    img.logo{max-width:320px;background:#1a2557;padding:18px;border-radius:12px;display:block;margin:0 auto 18px}
    h1,h2,h3{color:#0f2748}
    pre, code{background:#f6f8fb;padding:8px;border-radius:6px;overflow:auto}
    table{table-layout:fixed;width:100%;border-collapse:collapse;margin:12px 0}
    th,td{padding:8px;border:1px solid #e9eef6;text-align:left;vertical-align:top}
    thead th{background:#1a2557;color:#fff}
    @media print{
      body{background:#fff}
      .toolbar{display:none}
      .container{box-shadow:none;border-radius:0;margin:0;padding:12mm}
      img.logo{page-break-after:avoid}
      h2{page-break-after:avoid}
      .pagebreak{page-break-before:always}
    }
    /* Print header/footer */
    .print-header{display:none}
    .print-footer{display:none}
    @media print{
      .print-header{display:flex;position:fixed;top:0;left:0;right:0;height:36px;align-items:center;padding:6px 20px;border-bottom:1px solid #e6eef2;background:#fff;z-index:9999}
      .print-footer{display:flex;position:fixed;bottom:0;left:0;right:0;height:28px;align-items:center;padding:4px 20px;border-top:1px solid #e6eef2;background:#fff;justify-content:center;z-index:9999}
      .container{padding-top:56px;padding-bottom:40px}
    }
  </style>
</head>
<body>
  <div class="print-header"><div style="font-weight:700;color:#1a2557">SapthaEvent Portal — Project Workflow & Approval</div></div>
  <div class="print-footer"><div style="font-size:12px;color:#64748b">Sapthagiri NPS University — Generated on <span id="genDate"></span></div></div>
  <div class="toolbar">
    <button class="btn" id="printBtn">Print / Save as PDF</button>
    <div style="margin-left:12px;color:#64748b">Open this file in a browser and use Print → Save as PDF (A4)</div>
  </div>
  <div class="container" id="content">
    <img src="../static/snpsu-logo.png" class="logo" alt="Sapthagiri NPS University Logo" />
    <div id="md"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    async function loadMD(){
      try{
        const res = await fetch('SapthaEvent_Complete_Website_Workflow_and_Permission_Report.md');
        const text = await res.text();
        // Replace our \newpage markers with page breaks
        const html = marked.parse(text.replace(/\\newpage/g, '\n\n<div class="pagebreak"></div>\n\n'));
        document.getElementById('md').innerHTML = html;
        // Make tables responsive
        document.querySelectorAll('#md table').forEach(t => { t.style.tableLayout='fixed'; t.style.width='100%'; });
      }catch(err){
        document.getElementById('md').innerText = 'Could not load markdown file: ' + err;
      }
    }
    document.getElementById('genDate').innerText = new Date().toLocaleDateString();
    document.getElementById('printBtn').addEventListener('click', ()=> window.print());
    loadMD();
  </script>
</body>
</html>
