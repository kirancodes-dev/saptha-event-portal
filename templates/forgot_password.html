<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a2557">
    <title>Forgot Password | SapthaEvent</title>
    <link rel="icon" type="image/png" href="/static/snpsu-logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --snpsu-blue: #1a2557; --snpsu-orange: #c9a45e; }
        *{box-sizing:border-box;}
        html,body{margin:0;padding:0;}
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a2557 0%, #0a2a3f 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 12px;
        }
        .card-wrap { background:#fff; border-radius:16px; width:100%; max-width:440px; padding:32px; box-shadow:0 20px 50px rgba(0,0,0,.25); position:relative; }
        .card-wrap::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; background:var(--snpsu-orange); border-radius:16px 16px 0 0; }
        .logo-wrap { text-align:center; padding-bottom:16px; border-bottom:1px solid #e5e7eb; margin-bottom:20px; }
        .logo-wrap img { max-width:240px; width:100%; height:auto; }
        h1 { font-family:'Poppins',sans-serif; color:var(--snpsu-blue); font-weight:700; font-size:1.35rem; margin:0 0 6px; text-align:center; }
        .sub { color:#64748b; text-align:center; font-size:.88rem; margin-bottom:20px; }
        .form-label { font-size:.78rem; font-weight:700; color:var(--snpsu-blue); text-transform:uppercase; letter-spacing:.3px; margin-bottom:6px; }
        .form-control { background:#f1f5f9; border:1px solid #cbd5e1; border-radius:8px; padding:12px 15px; font-size:.95rem; }
        .form-control:focus { background:#fff; border-color:var(--snpsu-blue); box-shadow:0 0 0 4px rgba(26,37,87,.1); }
        .btn-submit { background:var(--snpsu-orange); color:#fff; font-weight:700; padding:12px; border-radius:8px; border:none; width:100%; margin-top:6px; transition:.2s; }
        .btn-submit:hover { background:#b8923f; transform:translateY(-1px); }
        .back-link { display:block; text-align:center; margin-top:16px; font-size:.85rem; color:var(--snpsu-blue); text-decoration:none; font-weight:600; }
        .back-link:hover { text-decoration:underline; }
        .alert { border-radius:8px; font-size:.88rem; padding:10px 14px; }
        @media (max-width:576px) {
            body { padding:0; align-items:stretch; }
            .card-wrap { border-radius:0; padding:24px 18px; min-height:100vh; display:flex; flex-direction:column; justify-content:center; box-shadow:none; max-width:100%; }
            .card-wrap::before { height:4px; border-radius:0; }
        }
    </style>
</head>
<body>
    <div class="card-wrap">
        <div class="logo-wrap">
            <img src="/static/snpsu-logo.png" alt="Sapthagiri NPS University">
        </div>
        <h1>Forgot Password?</h1>
        <p class="sub">Enter your registered email and we'll send you a reset link.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}{% endif %}
        {% endwith %}

        <form action="/forgot_password" method="POST" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required autofocus placeholder="your.email@university.edu">
            </div>
            <button type="submit" class="btn-submit">
                <i class="fas fa-paper-plane me-2"></i>Send Reset Link
            </button>
        </form>

        <a href="/login" class="back-link">
            <i class="fas fa-arrow-left me-1"></i>Back to Login
        </a>
    </div>
<script src="/static/js/global.js"></script>
</body>
</html>
