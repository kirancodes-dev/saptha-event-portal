<!-- ══ PWA: manifest, theme-color, iOS meta, service worker ══ -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a2557">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SapthaEvent">
<link rel="apple-touch-icon" href="/static/app-icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/app-icon.png">

<script>
(function () {
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;
  if (isStandalone) {
    localStorage.setItem('pwa_installed', '1');
  }

  // ── Service Worker registration and Live Updates ────
  window.pwaRegistration = null;
  window.pwaUpdateAvailable = false;

  window.applyPwaUpdateUI = function() {
    if (!window.pwaUpdateAvailable || !window.pwaRegistration) return;
    const reg = window.pwaRegistration;

    const loginBtn = document.getElementById('loginInstallBtn');
    if (loginBtn) {
      loginBtn.style.display = 'inline-block';
      loginBtn.innerHTML = '<i class="fas fa-sync me-1"></i>Update App';
      loginBtn.onclick = function(e) {
        e.preventDefault();
        if (reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        }
      };
    }

    const navBtn = document.getElementById('mn-install-btn');
    if (navBtn) {
      navBtn.style.display = 'flex';
      const icon = navBtn.querySelector('i');
      if (icon) {
        icon.className = 'fas fa-sync';
        icon.style.color = '#c9a45e';
      }
      const text = navBtn.querySelector('span');
      if (text) {
        text.innerText = 'Update';
        text.style.color = '#c9a45e';
      }
      navBtn.onclick = function(e) {
        e.preventDefault();
        if (reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        }
      };
    }
  };

  window.notifyPwaUpdateAvailable = function(reg) {
    window.pwaUpdateAvailable = true;
    window.applyPwaUpdateUI();
  };

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(function(reg) {
          window.pwaRegistration = reg;
          setInterval(() => reg.update(), 60 * 60 * 1000); // Check for updates hourly

          if (reg.waiting) {
            window.notifyPwaUpdateAvailable(reg);
          }

          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  window.notifyPwaUpdateAvailable(reg);
                }
              });
            }
          });
        })
        .catch(function (err) { console.warn('SW registration failed:', err); });

      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    });
  }

  // ── Listen for App Installed Event ────
  window.addEventListener('appinstalled', () => {
    localStorage.setItem('pwa_installed', '1');
    if (!window.pwaUpdateAvailable) {
      const loginBtn = document.getElementById('loginInstallBtn');
      if (loginBtn) loginBtn.style.display = 'none';
      const navBtn = document.getElementById('mn-install-btn');
      if (navBtn) navBtn.style.display = 'none';
    }
  });

  // ── PWA Install Banner (shown on ALL pages to logged-in users) ────
  const isInstalled = isStandalone || localStorage.getItem('pwa_installed') === '1';
  const dismissed = localStorage.getItem('pwa_banner_dismissed') === '1';

  if (!isInstalled && !dismissed) {
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.__pwaPrompt = e; // make globally accessible

      const visits = parseInt(localStorage.getItem('pwa_visit_count') || '0', 10) + 1;
      localStorage.setItem('pwa_visit_count', visits);
      const delay = visits === 1 ? 4000 : 1500;

      setTimeout(() => {
        const banner = document.getElementById('pwaInstallBanner');
        if (banner) banner.style.display = 'block';
      }, delay);
    });
  }

  document.addEventListener('DOMContentLoaded', window.applyPwaUpdateUI);
  window.addEventListener('load', window.applyPwaUpdateUI);
})();
</script>
