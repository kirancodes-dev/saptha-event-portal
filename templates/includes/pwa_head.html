<!-- PWA: manifest, theme, iOS hints, service worker registration + install button -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a2557">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SapthaEvent">
<link rel="apple-touch-icon" href="/static/snpsu-logo.png">
<style>
  #pwa-install-btn {
    position: fixed; bottom: 90px; right: 20px;
    z-index: 9998;
    background: #1a2557; color: #fff;
    border: none; border-radius: 999px;
    padding: 12px 20px;
    font-weight: 600; font-size: 14px;
    box-shadow: 0 10px 24px rgba(26,37,87,.28);
    cursor: pointer;
    display: none;
    align-items: center; gap: 8px;
  }
  #pwa-install-btn:hover { background: #0f1738; }
  #pwa-install-btn::before { content: '\2B07'; font-size: 14px; }
  .pwa-hint-modal {
    position: fixed; inset: 0; background: rgba(15,23,56,.55);
    z-index: 10000; display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .pwa-hint-modal.open { display: flex; }
  .pwa-hint-card {
    background: #fff; border-radius: 16px; max-width: 420px; width: 100%;
    padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .pwa-hint-card h4 { color: #1a2557; font-weight: 700; margin: 0 0 12px; }
  .pwa-hint-card ol { padding-left: 20px; margin: 0 0 16px; line-height: 1.6; }
  .pwa-hint-card .btn-close-hint {
    background: #1a2557; color: #fff; border: none; border-radius: 999px;
    padding: 8px 20px; font-weight: 600; cursor: pointer;
  }
</style>
<button id="pwa-install-btn" type="button" aria-label="Install SapthaEvent app">Install App</button>
<div id="pwa-hint-modal" class="pwa-hint-modal" role="dialog" aria-labelledby="pwa-hint-title">
  <div class="pwa-hint-card">
    <h4 id="pwa-hint-title">Install SapthaEvent</h4>
    <div id="pwa-hint-body"></div>
    <button type="button" class="btn-close-hint" onclick="document.getElementById('pwa-hint-modal').classList.remove('open')">Got it</button>
  </div>
</div>
<script>
(function () {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(function (reg) {
          // Request push permission and subscribe after a short delay
          if (!('PushManager' in window)) return;
          setTimeout(function () {
            fetch('/push/vapid_public_key')
              .then(function (r) { return r.json(); })
              .then(function (d) {
                if (!d.key) return;
                return Notification.requestPermission().then(function (perm) {
                  if (perm !== 'granted') return;
                  var key = d.key;
                  var appKey = key.length % 4 ? key + '==='.slice(key.length % 4) : key;
                  var raw = atob(appKey.replace(/-/g, '+').replace(/_/g, '/'));
                  var arr = new Uint8Array(raw.length);
                  for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
                  return reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: arr,
                  });
                });
              })
              .then(function (sub) {
                if (!sub) return;
                fetch('/push/subscribe', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json',
                    'X-CSRFToken': (document.querySelector('meta[name="csrf-token"]') || {}).content || '' },
                  credentials: 'same-origin',
                  body: JSON.stringify(sub.toJSON()),
                });
              })
              .catch(function () {});
          }, 3000);
        })
        .catch(function (err) { console.warn('SW registration failed:', err); });
    });
  }

  var deferredPrompt = null;
  var floatBtn = document.getElementById('pwa-install-btn');
  var navBtn = document.getElementById('nav-install-btn');

  function showButtons() {
    if (floatBtn) floatBtn.style.display = 'inline-flex';
    if (navBtn) navBtn.classList.remove('d-none');
  }
  function hideButtons() {
    if (floatBtn) floatBtn.style.display = 'none';
    if (navBtn) navBtn.classList.add('d-none');
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    showButtons();
  });

  function runPrompt() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () {
        deferredPrompt = null;
        hideButtons();
      });
      return;
    }
    // Fallback: show platform-specific hint
    var ua = navigator.userAgent || '';
    var isiOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    var isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(ua);
    var body = document.getElementById('pwa-hint-body');
    if (!body) return;
    if (isiOS || isSafari) {
      body.innerHTML = '<ol><li>Tap the Share icon in the address bar.</li>' +
                       '<li>Choose <b>Add to Home Screen</b>.</li>' +
                       '<li>Confirm the name and tap <b>Add</b>.</li></ol>';
    } else {
      body.innerHTML = '<ol><li>Open your browser menu (⋮).</li>' +
                       '<li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li>' +
                       '<li>Confirm to install SapthaEvent.</li></ol>';
    }
    document.getElementById('pwa-hint-modal').classList.add('open');
  }

  // Expose global handler used by the nav button
  window.triggerPwaInstall = runPrompt;

  if (floatBtn) floatBtn.addEventListener('click', runPrompt);

  // For browsers without beforeinstallprompt (iOS Safari), still reveal the nav button
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (!standalone && navBtn) {
    navBtn.classList.remove('d-none');
  }

  window.addEventListener('appinstalled', function () {
    hideButtons();
  });
})();
</script>
