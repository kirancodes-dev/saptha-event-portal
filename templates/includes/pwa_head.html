<!-- PWA: manifest, theme, iOS hints, and service worker registration -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a2557">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SapthaEvent">
<link rel="apple-touch-icon" href="/static/app-icon.png">

<script>
(function () {
  // Service Worker registration (handles offline availability in background)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function (err) { console.warn('SW registration failed:', err); });
    });
  }
})();
</script>
