<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Success | SapthaEvent</title>
    {% include "layouts/_bootstrap_css.html" %}
    <link href="/static/css/global.css" rel="stylesheet">
    {% include "layouts/_fontawesome.html" %}
    <style>
        :root{--blue:#1a2557;--orange:#c9a45e;}
        body { background: linear-gradient(135deg, var(--blue), #1a4fa0); color: white; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        .success-card { background: #ffffff; color: #1e293b; padding: 40px; border-radius: 20px; text-align: center; border: 1px solid #e2e8f0; max-width: 500px; width: 100%; }
        .check-icon { width: 80px; height: 80px; background: var(--orange); color: white; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(201, 164, 94, 0.5); }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="check-icon"><i class="fas fa-check"></i></div>
        <h2 class="fw-bold mb-2">Payment Successful!</h2>
        <p class="text-muted mb-4">You are registered for <strong>{{ title }}</strong></p>
        
        <div class="bg-black p-3 rounded mb-4 text-start">
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Transaction ID</span>
                <span class="text-white fw-mono">{{ reg_id }}</span>
            </div>
            <div class="d-flex justify-content-between">
                <span class="text-muted">Amount Paid</span>
                <span class="text-success fw-bold">₹{{ amount }}</span>
            </div>
        </div>

        <p class="small text-muted mb-4">A confirmation email with your Ticket QR Code has been sent.</p>
        
        <a href="/participant/dashboard" class="btn btn-primary w-100 fw-bold">Go to Dashboard</a>
    </div>
</body>
</html>
