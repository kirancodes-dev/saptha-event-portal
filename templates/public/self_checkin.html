<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self Check-in | {{ event.title }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root{--blue:#1a2557;--orange:#c9a45e;}
body{background:linear-gradient(135deg,var(--blue),#1a4fa0);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Segoe UI',sans-serif;}
.card{background:#fff;border-radius:20px;width:100%;max-width:400px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4);}
.card-top{background:linear-gradient(135deg,var(--blue),#1a4fa0);padding:28px;text-align:center;color:#fff;}
.card-top .icon{font-size:40px;margin-bottom:10px;}
.card-top h2{font-size:20px;font-weight:700;margin:0;}
.card-top p{font-size:13px;opacity:.7;margin:4px 0 0;}
.card-body{padding:28px;}
.form-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#64748b;margin-bottom:5px;}
.form-control{border-radius:10px;border:1.5px solid #e2e8f0;font-size:14px;padding:12px;}
.form-control:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,37,87,.1);}
.btn-checkin{background:var(--orange);color:#fff;border:none;width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;}
.btn-checkin:hover{background:#b8903f;}
.event-meta{font-size:12px;color:#94a3b8;text-align:center;margin-bottom:20px;}
</style>
</head>
<body>
<div class="card">
  <div class="card-top">
    <div class="icon">📍</div>
    <h2>Venue Check-in</h2>
    <p>{{ event.title }}</p>
  </div>
  <div class="card-body">
    <div class="event-meta">
      <i class="fas fa-calendar-alt me-1"></i>{{ event.get('date','TBD') }}
      &nbsp;·&nbsp;
      <i class="fas fa-map-marker-alt me-1"></i>{{ event.get('venue','SNPSU') }}
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} mb-3" style="font-size:13px;border-radius:10px;">{{ msg }}</div>
      {% endfor %}{% endif %}
    {% endwith %}

    <form method="POST" action="/checkin/{{ event.id }}/submit">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Your Registered Email</label>
        <input type="email" name="email" value="{{ pre_email }}" class="form-control"
               placeholder="you@example.com" required autofocus>
      </div>
      <button type="submit" class="btn-checkin">
        <i class="fas fa-check-circle me-2"></i>Mark Me Present
      </button>
    </form>

    <div style="text-align:center;margin-top:16px;">
      <a href="/" style="font-size:12px;color:#94a3b8;text-decoration:none;">
        <i class="fas fa-arrow-left me-1"></i>Back to Portal
      </a>
    </div>
  </div>
</div>
</body>
</html>
