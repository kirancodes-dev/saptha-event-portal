<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Team | SapthaEvent</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/css/global.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
{% include 'includes/pwa_head.html' %}
<style>
:root{--blue:#1a2557;--gold:#c9a45e;}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,var(--blue),#1a4fa0);min-height:100vh;padding:24px 16px;display:flex;align-items:center;justify-content:center;}
.card-wrap{background:#fff;border-radius:18px;padding:36px 32px;box-shadow:0 22px 54px rgba(0,0,0,.3);max-width:440px;width:100%;}
h1{font-family:'Poppins',sans-serif;color:var(--blue);font-weight:700;font-size:1.5rem;text-align:center;}
.icon-circle{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#1a4fa0);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;}
.code-input{font-family:'Courier New',monospace;font-size:1.6rem;letter-spacing:.6rem;text-align:center;padding:16px;background:#f1f5f9;border:2px solid #cbd5e1;border-radius:12px;text-transform:uppercase;font-weight:700;color:var(--blue);}
.code-input:focus{background:#fff;border-color:var(--blue);box-shadow:0 0 0 4px rgba(26,37,87,.12);outline:none;}
.btn-join{background:var(--gold);color:#fff;font-weight:700;padding:12px;border-radius:8px;border:none;width:100%;margin-top:18px;}
.btn-join:hover{background:#b88d4d;color:#fff;}
</style>
</head>
<body>
<div class="card-wrap">
    <div class="icon-circle"><i class="fas fa-user-plus"></i></div>
    <h1>Join a Team</h1>
    <p class="text-muted text-center small mb-4">Enter the 6-character code your team leader shared with you.</p>

    {% with msgs = get_flashed_messages(with_categories=true) %}
        {% if msgs %}{% for cat, m in msgs %}
            <div class="alert alert-{{ cat }} small py-2">{{ m }}</div>
        {% endfor %}{% endif %}
    {% endwith %}

    <form method="POST" action="/teams/join">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="join_code" class="code-input form-control"
               maxlength="6" minlength="6" required autofocus
               autocomplete="off" placeholder="______">
        <button type="submit" class="btn btn-join">
            <i class="fas fa-arrow-right me-1"></i> Join Team
        </button>
    </form>

    <div class="text-center mt-3">
        <a href="/participant/dashboard" class="small text-muted" style="text-decoration:none;">
            <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
        </a>
    </div>
</div>
<script>
    // Uppercase-as-you-type
    document.querySelector('.code-input').addEventListener('input', function(e){
        this.value = this.value.toUpperCase();
    });
</script>
</body>
</html>
